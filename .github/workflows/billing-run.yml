# Runs the billing job every hour: renewals, retries, suspensions, payment
# confirmations and notification emails. (A cPanel cron job calling the same
# address works too; this needs no server setup.)
name: Billing run

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: billing-run
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the billing job
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET not set yet; nothing to do."; exit 0; fi
          curl --fail-with-body -sS --max-time 300 -X POST -H "X-Cron-Secret: $CRON_SECRET" "${APP_URL%/}/api/cron/billing-run"
