<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 280" width="180" height="280">
  <defs>
    <linearGradient id="case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8ec"/>
      <stop offset="50%" stop-color="#c0c0c8"/>
      <stop offset="100%" stop-color="#8a8a94"/>
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="50%" stop-color="#2e2e38"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f8f8fa"/>
      <stop offset="100%" stop-color="#d8d8e0"/>
    </radialGradient>
    <filter id="wsh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.4"/></filter>
  </defs>
  <g filter="url(#wsh)">
    <!-- strap top -->
    <rect x="52" y="8" width="76" height="72" rx="10" fill="url(#band)"/>
    <!-- strap bottom -->
    <rect x="52" y="200" width="76" height="72" rx="10" fill="url(#band)"/>
    <!-- case -->
    <circle cx="90" cy="140" r="68" fill="url(#case)"/>
    <circle cx="90" cy="140" r="56" fill="url(#face)"/>
    <!-- ticks -->
    <g stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <line x1="90" y1="92" x2="90" y2="100"/>
      <line x1="90" y1="180" x2="90" y2="188"/>
      <line x1="42" y1="140" x2="50" y2="140"/>
      <line x1="130" y1="140" x2="138" y2="140"/>
    </g>
    <!-- hands -->
    <line x1="90" y1="140" x2="90" y2="108" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="140" x2="118" y2="128" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="140" r="5" fill="#e91cff"/>
    <!-- crown -->
    <rect x="154" y="128" width="12" height="24" rx="3" fill="url(#case)"/>
  </g>
</svg>
